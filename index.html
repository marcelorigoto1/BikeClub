<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Club · Routes</title>
    <link rel="icon" href="images/bike.png">

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Complementary pair: warm orange  <->  deep teal */
            --accent: #f26b3a;
            --accent-2: #f7a24b;
            --accent-soft: rgba(242, 107, 58, 0.13);
            --teal: #155e63;
            --teal-deep: #0e3b40;
            --teal-soft: rgba(21, 94, 99, 0.1);

            /* Warm sand neutrals */
            --bg: #f3eee6;
            --panel: #fffdf9;
            --panel-2: #f6f1e9;
            --line: rgba(14, 59, 64, 0.1);
            --text: #13302f;
            --muted: #6f7f7c;
            --radius: 16px;
            --shadow: 0 1px 2px rgba(14, 59, 64, 0.05), 0 8px 24px rgba(14, 59, 64, 0.07);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: grid;
            grid-template-rows: auto 1fr;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        button { font-family: inherit; }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 20px;
            color: #fdf8f1;
            background:
                radial-gradient(120% 180% at 100% 0%, rgba(247, 162, 75, 0.18) 0%, transparent 45%),
                linear-gradient(120deg, var(--teal-deep) 0%, var(--teal) 100%);
            box-shadow: 0 4px 18px rgba(14, 59, 64, 0.25);
            z-index: 1100;
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 6px 18px rgba(242, 107, 58, 0.45);
        }

        .brand-logo img {
            width: 26px;
            height: 26px;
            filter: brightness(0) invert(1);
        }

        .brand h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.2px;
        }

        .brand p {
            margin: 2px 0 0;
            font-size: 12px;
            color: rgba(253, 248, 241, 0.65);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn:hover { border-color: var(--teal); background: var(--teal-soft); }

        /* ── Layout ── */
        main {
            display: grid;
            grid-template-columns: 300px 1fr 340px;
            grid-template-rows: 1fr 210px;
            grid-template-areas:
                "routes map media"
                "routes chart media";
            gap: 12px;
            padding: 12px;
            min-height: 0;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 10px;
        }

        .card-head h2 {
            margin: 0;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--teal);
        }

        .pill {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 3px 9px;
            border-radius: 999px;
        }

        /* ── Routes list ── */
        #routes { grid-area: routes; }

        #route-list {
            list-style: none;
            margin: 0;
            padding: 0 10px 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .route {
            --c: var(--accent);
            position: relative;
            padding: 12px 14px 12px 18px;
            border-radius: 12px;
            background: var(--panel-2);
            border: 1px solid transparent;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.15s, background 0.15s;
        }

        .route::before {
            content: '';
            position: absolute;
            left: 0;
            top: 12px;
            bottom: 12px;
            width: 4px;
            border-radius: 0 4px 4px 0;
            background: var(--c);
            opacity: 0.35;
            transition: opacity 0.15s;
        }

        .route:hover { transform: translateY(-1px); border-color: var(--line); }

        .route.active {
            border-color: color-mix(in srgb, var(--c) 55%, transparent);
            background: color-mix(in srgb, var(--c) 10%, var(--panel-2));
        }

        .route.active::before { opacity: 1; }

        .route.focused { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent); }

        .route-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .route-title {
            font-weight: 700;
            font-size: 14px;
        }

        .route-date {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .toggle {
            width: 34px;
            height: 20px;
            border-radius: 999px;
            background: #d9d0c3;
            position: relative;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s;
        }

        .route.active .toggle { background: var(--c); }
        .route.active .toggle::after { transform: translateX(14px); }

        .route-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        .route-stats div {
            background: rgba(14, 59, 64, 0.045);
            border-radius: 8px;
            padding: 6px 8px;
        }

        .route-stats b {
            display: block;
            font-size: 13px;
            font-weight: 700;
        }

        .route-stats span {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .route-hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(14, 59, 64, 0.12);
            border-top-color: var(--c);
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Map ── */
        #map-card { grid-area: map; position: relative; }

        #map {
            flex: 1;
            background: #e9e3d8;
        }

        .maplibregl-map { font-family: inherit; }

        .maplibregl-ctrl-group {
            background: var(--panel) !important;
            border: 1px solid var(--line);
            border-radius: 10px !important;
            box-shadow: var(--shadow) !important;
            overflow: hidden;
        }

        .maplibregl-ctrl-attrib {
            background: rgba(255, 253, 249, 0.85) !important;
            color: var(--muted);
            font-size: 11px;
        }

        .maplibregl-ctrl-attrib a { color: #4b5b70; }

        .maplibregl-popup-content {
            background: var(--panel);
            color: var(--text);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 10px 14px;
            font-size: 13px;
        }

        .maplibregl-popup-tip { border-top-color: var(--panel) !important; border-bottom-color: var(--panel) !important; }

        .map-empty {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
            z-index: 500;
        }

        .map-empty div {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--line);
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--muted);
            backdrop-filter: blur(6px);
        }

        .pin {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .hover-pin {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--accent);
            box-shadow: 0 0 0 6px rgba(255, 107, 53, 0.25);
        }

        /* ── Map controls (inside the map) ── */
        .map-ctrl {
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--line) !important;
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 3px;
            gap: 2px;
        }

        .map-ctrl button {
            border: none;
            background: transparent;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            border-radius: 7px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }

        .map-ctrl button:hover { background: var(--panel-2); }
        .map-ctrl button.on { background: var(--teal); color: #fff; }

        .fit-ctrl button {
            width: 30px;
            height: 30px;
            padding: 0;
            font-size: 15px;
        }

        .fit-ctrl button { display: grid; place-items: center; }

        .ctrl-sep {
            width: 1px;
            margin: 4px 3px;
            background: var(--line);
        }

        .photo-marker { cursor: pointer; }

        /* ── Chart ── */
        #chart-card { grid-area: chart; }

        .chart-inner {
            position: relative;
            flex: 1;
            min-height: 0;
            padding: 0 14px 12px;
        }

        .chart-empty {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 13px;
        }

        /* ── Media ── */
        #media { grid-area: media; }

        .viewer {
            position: relative;
            margin: 0 12px;
            border-radius: 12px;
            overflow: hidden;
            background: #ebe4d9;
            aspect-ratio: 4 / 3;
            flex-shrink: 0;
        }

        .viewer img, .viewer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: zoom-in;
        }

        .viewer video { cursor: default; object-fit: contain; }

        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(10, 15, 23, 0.7);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: grid;
            place-items: center;
            backdrop-filter: blur(4px);
            transition: background 0.15s, transform 0.15s;
            z-index: 2;
        }

        .nav:hover { background: var(--teal); transform: translateY(-50%) scale(1.08); }
        .nav.prev { left: 10px; }
        .nav.next { right: 10px; }

        .empty-state {
            height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            padding: 20px;
            line-height: 1.6;
        }


        .media-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        #media-info { padding: 12px 14px 0; }
        #media-info:empty { display: none; }

        .info-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .info-time { font-weight: 700; font-size: 14px; }
        .info-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

        .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            color: var(--teal);
            background: var(--teal-soft);
            border-color: transparent;
        }

        .badge.none { color: var(--muted); background: var(--panel-2); border-color: var(--line); }
        .badge.warn { color: #c4501f; background: var(--accent-soft); border-color: transparent; }

        .locate {
            flex-shrink: 0;
            padding: 6px 12px;
            font-size: 12px;
            color: #fff;
            background: var(--teal);
            border-color: var(--teal);
        }

        .locate:hover { background: var(--teal-deep); border-color: var(--teal-deep); }

        #thumbs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px;
            align-content: start;
        }

        .play-tri {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 5px 0 5px 8px;
            border-color: transparent transparent transparent currentColor;
            margin-left: 2px;
        }

        .thumb .play .play-tri { border-width: 9px 0 9px 14px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5)); }

        /* ── Photo markers on the map ── */
        .photo-pin {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #fff;
            overflow: hidden;
            background: var(--panel-2);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            display: grid;
            place-items: center;
            font-size: 11px;
            transition: transform 0.15s, border-color 0.15s;
        }

        .photo-pin img { width: 100%; height: 100%; object-fit: cover; }
        .photo-pin:hover { transform: scale(1.3); }
        .photo-pin.active { border-color: var(--accent) !important; transform: scale(1.6); }

        .thumb {
            position: relative;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            background: var(--panel-2);
            border: 2px solid transparent;
            padding: 0;
            transition: border-color 0.15s, transform 0.15s;
        }

        .thumb:hover { transform: scale(1.03); }
        .thumb.active { border-color: var(--accent); }

        .thumb img, .thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .thumb .play {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.3);
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        /* ── Lightbox ── */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(10, 15, 23, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            padding: 40px;
        }

        #lightbox.open { display: flex; }

        #lightbox img, #lightbox video {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        #lightbox .close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 26px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        #lightbox .nav { width: 48px; height: 48px; font-size: 22px; }
        #lightbox .nav.prev { left: 20px; }
        #lightbox .nav.next { right: 20px; }

        /* ── Responsive ── */
        @media (max-width: 1200px) {
            main { grid-template-columns: 270px 1fr 290px; }
        }

        @media (max-width: 900px) {
            body { overflow: auto; display: block; }
            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto 60vh 220px auto;
                grid-template-areas: "routes" "map" "chart" "media";
            }
            #route-list { flex-direction: row; overflow-x: auto; }
            .route { min-width: 240px; }
            .brand p { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-logo"><img src="images/bike.png" alt=""></div>
            <div>
                <h1>Bike Club</h1>
                <p>Our rides, mapped</p>
            </div>
        </div>
    </header>

    <main>
        <section class="card" id="routes">
            <div class="card-head">
                <h2>Routes</h2>
                <span class="pill" id="route-count"></span>
            </div>
            <ul id="route-list"></ul>
        </section>

        <section class="card" id="map-card">
            <div id="map"></div>
            <div class="map-empty" id="map-empty"><div>Pick a route to start exploring</div></div>
        </section>

        <section class="card" id="chart-card">
            <div class="card-head">
                <h2>Elevation profile</h2>
                <span class="pill" id="chart-info" hidden></span>
            </div>
            <div class="chart-inner">
                <canvas id="elevationChart"></canvas>
                <div class="chart-empty" id="chart-empty">Elevation appears here when a route is on the map</div>
            </div>
        </section>

        <section class="card" id="media">
            <div class="card-head">
                <h2 id="media-title">Photos &amp; videos</h2>
                <span class="pill" id="media-counter" hidden></span>
            </div>
            <div class="viewer" id="viewer">
                <div class="empty-state"><div>Select a route to see<br>its photos and videos</div></div>
            </div>
            <div class="media-scroll">
                <div id="media-info"></div>
                <div id="thumbs"></div>
            </div>
        </section>
    </main>

    <div id="lightbox">
        <button class="close" id="lb-close" aria-label="Close">✕</button>
        <button class="nav prev" id="lb-prev" aria-label="Previous">‹</button>
        <div id="lb-content" style="display:contents"></div>
        <button class="nav next" id="lb-next" aria-label="Next">›</button>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // ── Config ──
        const ROUTES = [
            { id: 'rota_03_11',    date: '2024-11-03' },
            { id: 'rota_30_11',    date: '2024-11-30' },
            { id: 'rota_14_12',    date: '2024-12-14' },
            { id: 'rota_11_01_25', date: '2025-01-11' },
            { id: 'rota_18_01_25', date: '2025-01-18' },
        ];
        const COLORS = ['#f26b3a', '#1a7f86', '#e0a128', '#2f5f8f', '#c8505f', '#4f8a5b', '#8a5a9e'];
        const MEDIA_EXT = /\.(jpe?g|png|mp4)$/i;
        const VIDEO_EXT = /\.mp4$/i;

        ROUTES.forEach((r, i) => {
            r.color = COLORS[i % COLORS.length];
            r.name = 'Ride #' + (i + 1);
            r.dateLabel = new Date(r.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
        });

        const state = {};           // id -> { layer, profile, stats, visible, loading }
        let focusedRoute = null;
        let filesIndex = null;

        // ── Map ──
        // MapTiler key (restricted to this site's domains in the MapTiler dashboard).
        // The style file holds no key: it is appended to every MapTiler request here.
        const MAPTILER_KEY = '1nONS0P2LmjFLK6MvU9z';

        const map = new maplibregl.Map({
            container: 'map',
            style: 'styles/bikeclub-outdoor.json',
            center: [12.994, 47.818],
            zoom: 11,
            maxPitch: 75,
            attributionControl: { compact: true },
            transformRequest: (url) => {
                if (url.startsWith('https://api.maptiler.com/') && !/[?&]key=/.test(url)) {
                    return { url: url + (url.includes('?') ? '&' : '?') + 'key=' + MAPTILER_KEY };
                }
            },
        });
        const mapReady = new Promise(resolve => map.once('load', resolve));

        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-left');
        map.addControl(new maplibregl.ScaleControl({ maxWidth: 110 }), 'bottom-left');

        // ── Icons (drawn on canvas, so the style needs no sprite file) ──
        const ICONS = {
            bicycle:        { color: '#1f8b91', path: 'M5.5 13.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7M18.5 13.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7M5.5 17l4-7h6.5l2.5 7M9.5 10l3.5 7l3-7M13 6.5h2.5' },
            cafe:           { color: '#9a6a3e', path: 'M5 9h11v5a4.5 4.5 0 0 1-4.5 4.5h-2A4.5 4.5 0 0 1 5 14zM16 10.5h1.5a2.5 2.5 0 0 1 0 5H16M8 4.5v2M11.5 4.5v2' },
            drinking_water: { color: '#3f86a6', path: 'M12 3.5c3.2 4.2 5.5 7 5.5 10a5.5 5.5 0 0 1-11 0c0-3 2.3-5.8 5.5-10z' },
            beer:           { color: '#c98a1c', path: 'M6 7h9v12H6zM15 10h2.5a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5H15M9 10.5v5M12 10.5v5' },
            shelter:        { color: '#6f8a55', path: 'M3.5 12.5L12 5l8.5 7.5M7 10.5V19h10v-8.5' },
            toilets:        { color: '#7a7f8a', text: 'WC' },
            viewpoint:      { color: '#e2672f', path: 'M2.5 12s3.5-6 9.5-6s9.5 6 9.5 6s-3.5 6-9.5 6s-9.5-6-9.5-6zM12 9.3a2.7 2.7 0 1 0 0 5.4a2.7 2.7 0 1 0 0-5.4' },
            peak:           { peak: true },
        };

        function drawIcon(name) {
            const def = ICONS[name];
            if (!def) return null;
            const pr = 2, size = def.peak ? 13 : 20;
            const c = document.createElement('canvas');
            c.width = c.height = size * pr;
            const g = c.getContext('2d');
            g.scale(pr, pr);
            if (def.peak) {
                g.beginPath();
                g.moveTo(size / 2, 1.5); g.lineTo(size - 1, size - 1.5); g.lineTo(1, size - 1.5); g.closePath();
                g.fillStyle = '#7a5f3e'; g.fill();
                g.strokeStyle = '#fbf8f2'; g.lineWidth = 1.4; g.stroke();
            } else {
                g.beginPath();
                g.arc(size / 2, size / 2, size / 2 - 1.2, 0, Math.PI * 2);
                g.fillStyle = def.color; g.fill();
                g.strokeStyle = '#ffffff'; g.lineWidth = 1.4; g.stroke();
                if (def.text) {
                    g.fillStyle = '#fff'; g.font = '700 7.5px Inter, Arial, sans-serif';
                    g.textAlign = 'center'; g.textBaseline = 'middle';
                    g.fillText(def.text, size / 2, size / 2 + 0.5);
                } else {
                    const k = (size - 8) / 24;
                    g.translate(4, 4); g.scale(k, k);
                    g.strokeStyle = '#fff'; g.lineWidth = 2.3; g.lineCap = 'round'; g.lineJoin = 'round';
                    g.stroke(new Path2D(def.path));
                }
            }
            const px = g.getImageData(0, 0, c.width, c.height);
            return { width: px.width, height: px.height, data: new Uint8Array(px.data.buffer) };
        }

        map.on('styleimagemissing', (e) => {
            if (map.hasImage(e.id)) return;
            const img = drawIcon(e.id);
            if (img) map.addImage(e.id, img, { pixelRatio: 2 });
        });

        // ── Map controls ──
        let satelliteOn = false, terrainOn = false;

        // Relief layers are hidden over satellite imagery (it already shows the terrain).
        const RELIEF_LAYERS = ['hillshade', 'contour', 'contour-index', 'label-contour'];

        function setSatellite(on) {
            satelliteOn = on;
            map.setLayoutProperty('satellite', 'visibility', on ? 'visible' : 'none');
            RELIEF_LAYERS.forEach(id => map.setLayoutProperty(id, 'visibility', on ? 'none' : 'visible'));
        }

        function setTerrain(on) {
            terrainOn = on;
            map.setTerrain(on ? { source: 'terrain', exaggeration: 1.4 } : null);
            map.setLayoutProperty('building-3d', 'visibility', on ? 'visible' : 'none');
            map.setLayoutProperty('building', 'visibility', on ? 'none' : 'visible');
            map.easeTo({ pitch: on ? 60 : 0, bearing: on ? (map.getBearing() || -20) : 0, duration: 900 });
        }

        class MapModeControl {
            onAdd() {
                const box = document.createElement('div');
                box.className = 'maplibregl-ctrl map-ctrl';
                const mk = (label, title, onClick) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = label;
                    b.title = title;
                    b.onclick = onClick;
                    box.appendChild(b);
                    return b;
                };
                const sync = () => {
                    mapBtn.classList.toggle('on', !satelliteOn);
                    satBtn.classList.toggle('on', satelliteOn);
                    terBtn.classList.toggle('on', terrainOn);
                };
                const mapBtn = mk('Map', 'Bike Club Outdoor style', () => { setSatellite(false); sync(); });
                const satBtn = mk('Satellite', 'Satellite imagery with roads and labels', () => { setSatellite(true); sync(); });
                const sep = document.createElement('span');
                sep.className = 'ctrl-sep';
                box.appendChild(sep);
                const terBtn = mk('3D', '3D terrain and buildings', () => { setTerrain(!terrainOn); sync(); });
                sync();
                return box;
            }
            onRemove() {}
        }

        class FitControl {
            onAdd() {
                const box = document.createElement('div');
                box.className = 'maplibregl-ctrl map-ctrl fit-ctrl';
                const b = document.createElement('button');
                b.type = 'button';
                b.title = 'Zoom to visible routes';
                b.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
                b.onclick = fitVisible;
                box.appendChild(b);
                return box;
            }
            onRemove() {}
        }

        map.addControl(new MapModeControl(), 'top-right');
        map.addControl(new FitControl(), 'top-left');

        const hoverEl = document.createElement('div');
        hoverEl.className = 'hover-pin';
        const hoverMarker = new maplibregl.Marker({ element: hoverEl });
        const showHover = (lng, lat) => hoverMarker.setLngLat([lng, lat]).addTo(map);
        const hideHover = () => hoverMarker.remove();

        // Route layers go under the first label layer, so place names stay readable on top.
        const firstLabelId = () => map.getStyle().layers.find(l => l.type === 'symbol')?.id;

        function fitVisible() {
            const bounds = new maplibregl.LngLatBounds();
            ROUTES.forEach(r => { if (state[r.id]?.visible) bounds.extend(state[r.id].bounds); });
            if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 50, duration: 900 });
        }

        // ── Route list ──
        const list = document.getElementById('route-list');
        document.getElementById('route-count').textContent = ROUTES.length;

        ROUTES.forEach(r => {
            const li = document.createElement('li');
            li.className = 'route';
            li.id = 'route-' + r.id;
            li.style.setProperty('--c', r.color);
            li.innerHTML = `
                <div class="route-top">
                    <div>
                        <div class="route-title">${r.name}</div>
                        <div class="route-date">${r.dateLabel}</div>
                    </div>
                    <div class="toggle"></div>
                </div>
                <div class="route-body"><div class="route-hint">Tap to show on map</div></div>`;
            li.onclick = () => toggleRoute(r);
            list.appendChild(li);
        });

        function renderRouteBody(r) {
            const body = document.querySelector(`#route-${r.id} .route-body`);
            const s = state[r.id];
            if (s?.loading) {
                body.innerHTML = `<div class="route-hint"><span class="spinner"></span>Loading route…</div>`;
            } else if (s?.error) {
                body.innerHTML = `<div class="route-hint">Could not load this route</div>`;
            } else if (s?.stats) {
                const st = s.stats;
                body.innerHTML = `
                    <div class="route-stats">
                        <div><b>${st.distance.toFixed(1)} km</b><span>Distance</span></div>
                        <div><b>${Math.round(st.gain)} m</b><span>Climb</span></div>
                        <div><b>${st.duration}</b><span>Time</span></div>
                    </div>`;
            }
        }

        function updateRouteClasses() {
            ROUTES.forEach(r => {
                const el = document.getElementById('route-' + r.id);
                el.classList.toggle('active', !!state[r.id]?.visible);
                el.classList.toggle('focused', focusedRoute === r.id);
            });
            const anyVisible = ROUTES.some(r => state[r.id]?.visible);
            document.getElementById('map-empty').style.display = anyVisible ? 'none' : '';
        }

        async function toggleRoute(r) {
            const s = state[r.id];
            if (s?.loading) return;

            if (!s || s.error) {
                await loadRoute(r);
                if (!state[r.id]?.layersAdded) return;
                setRouteVisible(r, true);
                map.fitBounds(state[r.id].bounds, { padding: 50, duration: 900 });
                focusRoute(r);
            } else if (s.visible && focusedRoute !== r.id) {
                // Already shown: first click focuses it, second hides it
                focusRoute(r);
                map.fitBounds(s.bounds, { padding: 50, duration: 900 });
            } else if (s.visible) {
                setRouteVisible(r, false);
                const next = ROUTES.find(x => state[x.id]?.visible);
                if (next) focusRoute(next); else clearFocus();
            } else {
                setRouteVisible(r, true);
                map.fitBounds(s.bounds, { padding: 50, duration: 900 });
                focusRoute(r);
            }
            updateRouteClasses();
            updateChart();
        }

        const routeLayerIds = (id) => [`route-${id}-casing`, `route-${id}-line`, `route-${id}-ends`];

        function setRouteVisible(r, on) {
            const s = state[r.id];
            s.visible = on;
            routeLayerIds(r.id).forEach(l => map.setLayoutProperty(l, 'visibility', on ? 'visible' : 'none'));
            (s.mediaMarkers || []).forEach(mk => mk && (on ? mk.addTo(map) : mk.remove()));
        }

        function focusRoute(r) {
            focusedRoute = r.id;
            ROUTES.forEach(x => {
                if (!state[x.id]?.layersAdded) return;
                const focused = x.id === r.id;
                map.setPaintProperty(`route-${x.id}-line`, 'line-opacity', focused ? 1 : 0.5);
                map.setPaintProperty(`route-${x.id}-line`, 'line-width', routeWidth(focused ? 1 : 0.65));
            });
            // Draw the focused route above the others (still under the labels)
            if (state[r.id]?.layersAdded) routeLayerIds(r.id).forEach(l => map.moveLayer(l, firstLabelId()));
            loadMedia(r);
            updateRouteClasses();
        }

        // Line width grows with zoom; `k` scales it down for routes that are not focused.
        const routeWidth = (k) => ['interpolate', ['linear'], ['zoom'], 9, 2.5 * k, 13, 4.5 * k, 17, 8 * k];

        function clearFocus() {
            focusedRoute = null;
            showMediaEmpty('Select a route to see<br>its photos and videos');
            document.getElementById('media-title').textContent = 'Photos & videos';
        }

        // ── Data loading ──
        async function loadRoute(r) {
            state[r.id] = { loading: true };
            renderRouteBody(r);
            try {
                const res = await fetch(`data/${r.id}/${r.id}.geojson`);
                if (!res.ok) throw new Error(res.status);
                const data = await res.json();

                // Each feature is a short segment; its START_* properties describe its first point.
                const points = [];
                data.features.forEach(f => {
                    const c = f.geometry?.coordinates;
                    if (!c?.length) return;
                    points.push({
                        lon: c[0][0], lat: c[0][1],
                        ele: f.properties?.START_Elevation ?? null,
                        t: f.properties?.START_DateTime ?? null,
                    });
                });
                const last = data.features.at(-1)?.geometry?.coordinates?.at(-1);
                if (last) points.push({ lon: last[0], lat: last[1], ele: points.at(-1)?.ele ?? null, t: points.at(-1)?.t ?? null });

                // Distance + elevation
                let dist = 0, gain = 0, maxEle = -Infinity, lastEle = null;
                points.forEach((p, i) => {
                    if (i > 0) dist += haversine(points[i - 1].lat, points[i - 1].lon, p.lat, p.lon);
                    p.d = dist;
                    if (p.ele != null) {
                        maxEle = Math.max(maxEle, p.ele);
                        // Small threshold filters out GPS noise when summing climb
                        if (lastEle == null) lastEle = p.ele;
                        else if (p.ele - lastEle > 3) { gain += p.ele - lastEle; lastEle = p.ele; }
                        else if (lastEle - p.ele > 3) lastEle = p.ele;
                    }
                });

                const times = points.map(p => p.t).filter(Boolean);
                const duration = times.length > 1
                    ? formatDuration(times.reduce((a, b) => Math.max(a, b)) - times.reduce((a, b) => Math.min(a, b)))
                    : '—';

                // Downsample for the chart (keeps it fast and smooth)
                const step = Math.max(1, Math.floor(points.length / 800));
                const profile = points.filter((p, i) => i % step === 0 && p.ele != null)
                    .map(p => ({ x: +p.d.toFixed(3), y: +p.ele.toFixed(1), lat: p.lat, lng: p.lon }));

                const coords = points.map(p => [p.lon, p.lat]);
                const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));

                await mapReady;
                addRouteLayers(r, coords);

                state[r.id] = {
                    layersAdded: true, bounds, profile, visible: false,
                    stats: { distance: dist, gain, maxEle, duration },
                };
            } catch (err) {
                console.error('Error loading route', r.id, err);
                state[r.id] = { error: true };
            }
            renderRouteBody(r);
        }

        // One GeoJSON source per ride: the track line plus its start/finish points.
        function addRouteLayers(r, coords) {
            const id = r.id, before = firstLabelId();
            map.addSource(`route-${id}`, {
                type: 'geojson',
                data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } },
            });
            map.addSource(`route-${id}-ends`, {
                type: 'geojson',
                data: {
                    type: 'FeatureCollection',
                    features: [
                        { type: 'Feature', properties: { kind: 'start' }, geometry: { type: 'Point', coordinates: coords[0] } },
                        { type: 'Feature', properties: { kind: 'finish' }, geometry: { type: 'Point', coordinates: coords.at(-1) } },
                    ],
                },
            });
            const lineLayout = { 'line-cap': 'round', 'line-join': 'round', visibility: 'none' };
            map.addLayer({
                id: `route-${id}-casing`, type: 'line', source: `route-${id}`, layout: lineLayout,
                paint: {
                    'line-color': '#ffffff',
                    'line-opacity': 0.9,
                    'line-width': ['interpolate', ['linear'], ['zoom'], 9, 5, 13, 8, 17, 13],
                },
            }, before);
            map.addLayer({
                id: `route-${id}-line`, type: 'line', source: `route-${id}`, layout: lineLayout,
                paint: { 'line-color': r.color, 'line-width': routeWidth(1) },
            }, before);
            map.addLayer({
                id: `route-${id}-ends`, type: 'circle', source: `route-${id}-ends`, layout: { visibility: 'none' },
                paint: {
                    'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, 3.5, 15, 6],
                    'circle-color': ['match', ['get', 'kind'], 'start', '#2f9e5b', '#d64545'],
                    'circle-stroke-color': '#ffffff',
                    'circle-stroke-width': 2,
                },
            }, before);

            map.on('click', `route-${id}-line`, (e) => {
                const st = state[id]?.stats;
                new maplibregl.Popup({ offset: 8 })
                    .setLngLat(e.lngLat)
                    .setHTML(`<b>${r.name}</b><br>${r.dateLabel}${st ? `<br>${st.distance.toFixed(1)} km · ${Math.round(st.gain)} m climb` : ''}`)
                    .addTo(map);
                if (focusedRoute !== id) focusRoute(r);
            });
            map.on('mouseenter', `route-${id}-line`, () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', `route-${id}-line`, () => { map.getCanvas().style.cursor = ''; });
        }

        // media.json (generated by media_create.py) has EXIF + positions.
        // files.json is the old plain list, used as a fallback.
        async function getFilesIndex() {
            if (!filesIndex) {
                try {
                    const res = await fetch('data/media.json');
                    if (!res.ok) throw new Error(res.status);
                    filesIndex = await res.json();
                } catch {
                    const res = await fetch('data/files.json');
                    const plain = await res.json();
                    filesIndex = Object.fromEntries(Object.entries(plain).map(([k, files]) =>
                        [k, files.map(f => ({ file: f, type: VIDEO_EXT.test(f) ? 'video' : 'photo' }))]));
                }
            }
            return filesIndex;
        }

        // ── Media ──
        let media = [], mediaIndex = 0;

        function showMediaEmpty(html) {
            media = [];
            document.getElementById('viewer').innerHTML = `<div class="empty-state"><div>${html}</div></div>`;
            document.getElementById('thumbs').innerHTML = '';
            document.getElementById('media-info').innerHTML = '';
            document.getElementById('media-counter').hidden = true;
            highlightMarker();
        }

        async function getRouteMedia(r) {
            try {
                const items = (await getFilesIndex())[r.id] || [];
                return items.filter(m => MEDIA_EXT.test(m.file))
                    .map(m => ({ ...m, src: `data/${r.id}/${encodeURIComponent(m.file)}` }));
            } catch (err) {
                console.error('Error fetching media index', err);
                return [];
            }
        }

        // Photo/video markers belong to their route: setRouteVisible() shows and hides them with it.
        async function addMediaMarkers(r) {
            const s = state[r.id];
            if (!s?.layersAdded || s.mediaMarkers) return;
            s.mediaMarkers = [];
            const items = await getRouteMedia(r);
            items.forEach((m, i) => {
                if (m.lat == null) return;
                const el = document.createElement('div');
                el.className = 'photo-marker';
                el.title = `${m.type === 'video' ? 'Video' : 'Photo'} · ${formatTime(m.time) || m.file}`;
                el.innerHTML = `<div class="photo-pin" style="border-color:${r.color}">${m.type === 'video' ? '<span class="play-tri"></span>' : `<img src="${m.src}" loading="lazy" alt="">`}</div>`;
                el.addEventListener('click', async (ev) => {
                    ev.stopPropagation();
                    if (focusedRoute !== r.id) { focusRoute(r); await mediaReady; }
                    showMedia(i);
                });
                const marker = new maplibregl.Marker({ element: el }).setLngLat([m.lng, m.lat]);
                if (s.visible) marker.addTo(map);
                s.mediaMarkers[i] = marker;
            });
            highlightMarker();
        }

        let mediaReady = Promise.resolve();

        function loadMedia(r) {
            mediaReady = (async () => {
                document.getElementById('media-title').textContent = `${r.name} · Photos & videos`;
                const items = await getRouteMedia(r);
                if (focusedRoute !== r.id) return;
                media = items;
                addMediaMarkers(r);
                if (!media.length) return showMediaEmpty('No photos or videos<br>for this ride yet');

                const thumbs = document.getElementById('thumbs');
                thumbs.innerHTML = '';
                media.forEach((m, i) => {
                    const b = document.createElement('button');
                    b.className = 'thumb';
                    b.title = m.file;
                    b.innerHTML = (m.type === 'video'
                        ? `<video src="${m.src}#t=1" preload="metadata" muted></video><span class="play"><span class="play-tri"></span></span>`
                        : `<img src="${m.src}" loading="lazy" alt="">`);
                    b.onclick = () => showMedia(i);
                    thumbs.appendChild(b);
                });
                showMedia(0);
            })();
            return mediaReady;
        }

        function highlightMarker() {
            ROUTES.forEach(r => (state[r.id]?.mediaMarkers || []).forEach((mk, i) => {
                const el = mk?.getElement()?.querySelector('.photo-pin');
                if (el) el.classList.toggle('active', r.id === focusedRoute && i === mediaIndex);
            }));
        }

        function renderMediaInfo(m) {
            const box = document.getElementById('media-info');
            const ex = m.exif || {};
            const camera = [ex.Make, ex.Model].filter(Boolean).join(' ').replace(/^(\w)/, c => c.toUpperCase());
            const shot = [
                ex.FNumber && `f/${ex.FNumber}`,
                ex.ExposureTime && (ex.ExposureTime < 1 ? `1/${Math.round(1 / ex.ExposureTime)}s` : `${ex.ExposureTime}s`),
                ex.ISOSpeedRatings && `ISO ${ex.ISOSpeedRatings}`,
                (ex.FocalLengthIn35mmFilm || ex.FocalLength) && `${ex.FocalLengthIn35mmFilm || ex.FocalLength}mm`,
                m.type === 'video' && ex.Duration && `${Math.round(ex.Duration)}s video`,
            ].filter(Boolean).join(' · ');

            const badges = [];
            if (m.lat == null && m.exif) badges.push('<span class="badge none">No location</span>');
            if (m.alt != null) badges.push(`<span class="badge">${Math.round(m.alt)} m altitude</span>`);
            if (m.width) badges.push(`<span class="badge">${m.width}×${m.height}</span>`);
            if (m.otherDay) badges.push('<span class="badge warn" title="This file was taken on a different day than the ride">Different day</span>');

            box.innerHTML = `
                <div class="info-top">
                    <div>
                        <div class="info-time">${formatTime(m.time, true) || m.file}</div>
                        <div class="info-sub">${[camera, shot].filter(Boolean).join(' — ') || m.file}</div>
                    </div>
                    ${m.lat != null ? '<button class="btn locate" id="locate-btn">Show on map</button>' : ''}
                </div>
                <div class="badges">${badges.join('')}</div>`;

            const locate = document.getElementById('locate-btn');
            if (locate) locate.onclick = () => map.flyTo({ center: [m.lng, m.lat], zoom: Math.max(map.getZoom(), 16), duration: 800 });
        }

        function mediaElement(m, big) {
            return m.type === 'video'
                ? `<video src="${m.src}" controls playsinline ${big ? 'autoplay' : ''}></video>`
                : `<img src="${m.src}" alt="Ride photo">`;
        }

        function showMedia(i) {
            if (!media.length) return;
            mediaIndex = (i + media.length) % media.length;
            const item = media[mediaIndex];
            const viewer = document.getElementById('viewer');
            viewer.innerHTML = `
                <button class="nav prev" aria-label="Previous">‹</button>
                ${mediaElement(item)}
                <button class="nav next" aria-label="Next">›</button>`;
            viewer.querySelector('.prev').onclick = () => showMedia(mediaIndex - 1);
            viewer.querySelector('.next').onclick = () => showMedia(mediaIndex + 1);
            const img = viewer.querySelector('img');
            if (img) img.onclick = openLightbox;

            document.querySelectorAll('.thumb').forEach((t, j) => t.classList.toggle('active', j === mediaIndex));
            const counter = document.getElementById('media-counter');
            counter.hidden = false;
            counter.textContent = `${mediaIndex + 1} / ${media.length}`;
            renderMediaInfo(item);
            highlightMarker();
            if (lightbox.classList.contains('open')) renderLightbox();
        }

        // ── Lightbox ──
        const lightbox = document.getElementById('lightbox');
        function openLightbox() { lightbox.classList.add('open'); renderLightbox(); }
        function closeLightbox() { lightbox.classList.remove('open'); document.getElementById('lb-content').innerHTML = ''; }
        function renderLightbox() { document.getElementById('lb-content').innerHTML = mediaElement(media[mediaIndex], true); }

        document.getElementById('lb-close').onclick = closeLightbox;
        document.getElementById('lb-prev').onclick = () => showMedia(mediaIndex - 1);
        document.getElementById('lb-next').onclick = () => showMedia(mediaIndex + 1);
        lightbox.onclick = (e) => { if (e.target === lightbox) closeLightbox(); };
        document.addEventListener('keydown', (e) => {
            if (!media.length) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') showMedia(mediaIndex - 1);
            if (e.key === 'ArrowRight') showMedia(mediaIndex + 1);
        });

        // ── Elevation chart ──
        Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
        Chart.defaults.color = '#6f7f7c';

        const chart = new Chart(document.getElementById('elevationChart'), {
            type: 'line',
            data: { datasets: [] },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 400 },
                parsing: false,
                interaction: { mode: 'nearest', axis: 'x', intersect: false },
                scales: {
                    x: {
                        type: 'linear',
                        ticks: { callback: v => v + ' km', maxTicksLimit: 10, font: { size: 11 } },
                        grid: { color: 'rgba(14,59,64,0.05)' },
                        border: { display: false },
                    },
                    y: {
                        ticks: { callback: v => v + ' m', maxTicksLimit: 5, font: { size: 11 } },
                        grid: { color: 'rgba(14,59,64,0.08)' },
                        border: { display: false },
                    },
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(255,253,249,0.97)',
                        borderColor: 'rgba(14,59,64,0.14)',
                        titleColor: '#13302f',
                        bodyColor: '#3b4a5e',
                        borderWidth: 1,
                        padding: 10,
                        displayColors: true,
                        callbacks: {
                            title: items => items[0].parsed.x.toFixed(1) + ' km',
                            label: item => ` ${item.dataset.label}: ${Math.round(item.parsed.y)} m`,
                        },
                    },
                },
                onHover: (evt, elements) => {
                    const el = elements[0];
                    if (!el) { hideHover(); return; }
                    const p = chart.data.datasets[el.datasetIndex].data[el.index];
                    showHover(p.lng, p.lat);
                },
            },
        });

        document.getElementById('elevationChart').addEventListener('mouseleave', hideHover);

        function updateChart() {
            const visible = ROUTES.filter(r => state[r.id]?.visible);
            const ctx = chart.ctx;
            chart.data.datasets = visible.map(r => {
                const h = chart.chartArea?.bottom || 180;
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, r.color + '40');
                grad.addColorStop(1, r.color + '00');
                return {
                    label: r.name,
                    data: state[r.id].profile,
                    borderColor: r.color,
                    backgroundColor: grad,
                    fill: visible.length === 1 ? 'origin' : false,
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    tension: 0.25,
                };
            });
            chart.update();

            document.getElementById('chart-empty').style.display = visible.length ? 'none' : '';
            const info = document.getElementById('chart-info');
            if (visible.length === 1) {
                const st = state[visible[0].id].stats;
                info.hidden = false;
                info.textContent = `Max ${Math.round(st.maxEle)} m · +${Math.round(st.gain)} m`;
            } else {
                info.hidden = true;
            }
        }

        // ── Helpers ──
        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const toRad = x => (x * Math.PI) / 180;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function formatTime(iso, long) {
            if (!iso) return '';
            // Keep the local time written in the file (e.g. 2024-12-14T12:43:09+01:00)
            const [d, t] = iso.split('T');
            const [y, mo, day] = d.split('-');
            const hm = t.slice(0, 5);
            return long ? `${day}/${mo}/${y} · ${hm}` : hm;
        }

        function formatDuration(ms) {
            const mins = Math.round(ms / 60000);
            const h = Math.floor(mins / 60), m = mins % 60;
            return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m} min`;
        }

        // Open the most recent ride by default
        toggleRoute(ROUTES.at(-1));
    </script>
</body>
</html>
